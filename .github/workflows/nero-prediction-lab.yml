name: Nero Prediction Lab

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nero-prediction-lab
  cancel-in-progress: false

jobs:
  prediction-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run prediction lab
        run: python tools/nero_prediction_lab.py
        env:
          PREDICTION_LAB_ASSETS: BTC,GOLD
          PREDICTION_LAB_HORIZON_DAYS: "1"
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      - name: Resolve Bellwether calibration
        run: python tools/nero_bellwether_calibration.py
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      - name: Save prediction lab records
        run: |
          git config user.name "nero-prediction-lab"
          git config user.email "actions@users.noreply.github.com"
          if [ -f nero_app/data/prediction_log.csv ]; then
            git add -f nero_app/data/prediction_log.csv
          fi
          if [ -f reports/prediction_lab_report.csv ]; then
            git add -f reports/prediction_lab_report.csv
          fi
          if [ -f nero_app/data/bellwether_calibration/forecast_ledger.csv ]; then
            git add -f nero_app/data/bellwether_calibration/forecast_ledger.csv
          fi
          if [ -f nero_app/data/bellwether_calibration/heartbeats.csv ]; then
            git add -f nero_app/data/bellwether_calibration/heartbeats.csv
          fi
          if [ -f reports/bellwether_calibration_report.csv ]; then
            git add -f reports/bellwether_calibration_report.csv
          fi
          if [ -f reports/bellwether_calibration_report.json ]; then
            git add -f reports/bellwether_calibration_report.json
          fi
          if git diff --cached --quiet; then
            echo "no prediction lab changes"
            exit 0
          fi
          git commit -m "Update Nero prediction lab records"
          git pull --rebase origin main
          git push
