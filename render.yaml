services:
  - type: web
    name: project-nero
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PREFER_LIVE
        value: "true"
      - key: USE_LATEST_NEWS
        value: "true"
      - key: MOBILE_ALERTS_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: RECEIVER_EMAIL
        sync: false
